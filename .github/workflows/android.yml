name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build, run unit tests, and lint
        run: ./gradlew build -PperformanceTests=true :benchmark:assembleBenchmark --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mvvm-base-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-and-lint-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

  android-instrumented-tests:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run app, Room, and DataStore instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest :feature:home:data:connectedDebugAndroidTest :feature:settings:data:connectedDebugAndroidTest :feature:feed:data:connectedDebugAndroidTest :feature:auth:data:connectedDebugAndroidTest :core:media:connectedDebugAndroidTest :core:platform:connectedDebugAndroidTest --no-parallel --no-daemon
            ./gradlew :app:connectedDebugAndroidTest -PdemoAuth=true --no-parallel --no-daemon
            ./gradlew :app:installBenchmark --no-daemon
            adb shell am start -W -n com.will.mvvmbase.development/com.will.mvvmbase.MainActivity
            adb shell pidof com.will.mvvmbase.development
            adb exec-out screencap -p > release-smoke.png

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-test-reports
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
            release-smoke.png
          if-no-files-found: ignore
          retention-days: 7
